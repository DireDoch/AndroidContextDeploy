name: Idea or suggestion
description: A step you do by hand, something the tool should support, anything at all
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas do not have to come with code, or even with a solution. If you
        repeat something by hand on every phone, describing it is enough.

  - type: textarea
    id: what
    attributes:
      label: What do you do by hand today?
      description: The step, the setting, the screen -- however you would describe it to a colleague.
      placeholder: On every phone I also have to turn off auto-rotate and...
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: What goes wrong when it is forgotten, or how long it costs you.
    validations:
      required: false

  - type: dropdown
    id: shape
    attributes:
      label: Does this feel like a deploy.json entry, a new screen or a new Module?
      description: A guess is fine -- "no idea" is a perfectly good answer.
      options:
        - No idea
        - An app or an Android setting (probably a deploy.json entry)
        - A screen the tool does not recognise (probably keywords + a fixture)
        - Something ADB can do that the tool does not (probably a Module)
        - Another Phone Language or UI Language
        - Something else
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Your fleet, your MDM, your constraints, a link -- whatever helps.
    validations:
      required: false
