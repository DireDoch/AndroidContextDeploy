name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest -q

  manual:
    name: Manual builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The PDF is committed, so this only proves the source still compiles -
      # it is what stops docs/manual.typ rotting while nobody rebuilds it.
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Compile the manual
        run: typst compile docs/manual.typ /tmp/manual.pdf
