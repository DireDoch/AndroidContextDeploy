name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      # Linux runs the real-window tests under a virtual display and is where
      # coverage is enforced: ACD_REQUIRE_GUI turns a skipped GUI test into a failure.
      - name: pytest, GUI under Xvfb, coverage >= 80 %
        if: runner.os == 'Linux'
        env:
          ACD_REQUIRE_GUI: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest --cov --cov-fail-under=80

      # The window tests run on Linux only: creating Tk windows on the hosted
      # Windows image fails now and then with "Can't find a usable init.tcl".
      - name: pytest (without the window tests)
        if: runner.os == 'Windows'
        run: python -m pytest -m "not gui"

  manual:
    name: Manual builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      # The flags at the top of docs/manual.typ: embedded fonts only and a fixed
      # date, so the PDF is the same bytes on any machine. Typst has no option to
      # fail on warnings, so the log is checked.
      - name: Compile the manual, failing on any warning
        run: |
          mkdir -p build
          typst compile --ignore-system-fonts --creation-timestamp 1767225600 docs/manual.typ build/manual.pdf 2> build/typst.log || { cat build/typst.log; exit 1; }
          cat build/typst.log
          if grep -q "warning:" build/typst.log; then echo "::error file=docs/manual.typ::Typst warnings, see the log above"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: manual
          path: build/manual.pdf
          if-no-files-found: error

      - name: The committed PDF matches its source
        run: |
          cmp docs/manual.pdf build/manual.pdf || {
            echo "::error file=docs/manual.pdf::docs/manual.pdf is out of date: rebuild it with the command at the top of docs/manual.typ"
            exit 1
          }
