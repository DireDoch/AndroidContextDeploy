name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      # Linux runs the real-window tests under a virtual display and is where
      # coverage is enforced: ACD_REQUIRE_GUI turns a skipped GUI test into a failure.
      - name: pytest, GUI under Xvfb, coverage >= 80 %
        if: runner.os == 'Linux'
        env:
          ACD_REQUIRE_GUI: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest --cov --cov-fail-under=80

      - name: pytest
        if: runner.os == 'Windows'
        run: python -m pytest

  manual:
    name: Manual builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The PDF is committed, so this only proves the source still compiles -
      # it is what stops docs/manual.typ rotting while nobody rebuilds it.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Compile the manual
        run: typst compile docs/manual.typ /tmp/manual.pdf
