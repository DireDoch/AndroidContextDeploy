name: Release

# Push a tag like v1.0.0: builds the Windows and Linux bundles, then publishes
# them with SHA256SUMS.txt and a build provenance attestation.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        # Pinned: the Linux bundle needs the glibc of the machine that built it
        # (2.39 on 24.04), and the README promises exactly that.
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the version requirements.txt is locked for

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Build
        run: python build.py ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            dist/AndroidContextDeploy-v*.zip
            dist/AndroidContextDeploy-v*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum AndroidContextDeploy-v* > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Anyone can check an archive came from this workflow:
      #   gh attestation verify <archive> -R DireDoch/AndroidContextDeploy
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/AndroidContextDeploy-v*

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
